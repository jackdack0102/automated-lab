apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-probe-app
  labels:
    app: network-probe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-probe
  template:
    metadata:
      labels:
        app: network-probe
    spec:
      containers:
      - name: probe-container
        image: hoanghuynh555/automated-lab:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_HOST
          value: "redis-service"
---
apiVersion: v1
kind: Service
metadata:
  name: network-probe-service
spec:
  type: ClusterIP
  selector:
    app: network-probe
  ports:
    - port: 8000
      targetPort: 8000