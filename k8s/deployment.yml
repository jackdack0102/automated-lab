apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-probe-app
  labels:
    app: network-probe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-probe
  template:
    metadata:
      labels:
        app: network-probe
    spec:
      containers:
      - name: probe-container
        image: /network-probe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: network-probe-service
spec:
  type: NodePort
  selector:
    app: network-probe
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080